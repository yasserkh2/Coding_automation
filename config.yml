# Project-level defaults for coding automation.
#
# Keep secrets in .env. This file is intended to be committed and shared.

project:
  root: .
  projects_dir: projects

graph:
  entrypoint: project_router
  routes:
    new: new_project
    enhance: enhance_project
  required_inputs:
    new:
      - task_status
      - business_requirement
      - task_md
    enhance:
      - task_status
      - task_md
  skill_max_turns: 3
  compact_conversation_tokens: 10000

codex:
  model_provider: openrouter
  model: openai/gpt-5.4-mini
  provider_name: OpenRouter
  base_url: https://openrouter.ai/api/v1
  env_key: OPENROUTER_API_KEY
  timeout_seconds: 1800
  reasoning_effort: minimal
  nodes:
    implement_new_project:
      model: openai/gpt-5.4-mini
      reasoning_effort: minimal
    create_enhance_project_docs:
      model: openai/gpt-5.4-mini
      reasoning_effort: minimal
    ai_orchestrator:
      model: openai/gpt-5.4-mini
      reasoning_effort: minimal
    backend:
      model: openai/gpt-5.4-mini
      reasoning_effort: minimal
    frontend:
      model: openai/gpt-5.4-mini
      reasoning_effort: minimal
    system_designer:
      model: openai/gpt-5.4-mini
      reasoning_effort: minimal
    compact_conversation:
      model: openai/gpt-5.4-mini
      reasoning_effort: minimal
